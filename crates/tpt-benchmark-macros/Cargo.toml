[package]
name = "tpt-benchmark-macros"
description = "Procedural macros for tpt-benchmark. Use the `tpt-benchmark` crate, which re-exports them."
keywords = ["benchmark", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers", "development-tools::benchmarking"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
tpt-benchmark = { path = "../tpt-benchmark", version = "0.1.0" }
trybuild = "1"

[lints]
workspace = true
