[package]
name = "tpt-benchmark"
description = "A layered, statistically sequential benchmarking framework for Rust."
keywords = ["benchmark", "bench", "performance", "statistics", "profiling"]
categories = ["development-tools::profiling", "development-tools::benchmarking"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/tpt-benchmark"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series"] }
tpt-benchmark-macros = { path = "../tpt-benchmark-macros", version = "0.1.0" }

[[bench]]
name = "macros_demo"
harness = false

[[bench]]
name = "vs_criterion"
harness = false

[[bench]]
name = "vs_tpt"
harness = false

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
